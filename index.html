<!DOCTYPE html>
<html>

<head>

<title>Smart AI Study Planner Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

</head>

<body>

<h1>Smart AI Study Planner</h1>

<button onclick="toggleDark()">Toggle Dark Mode</button>

<div class="container">

<h2>Enter Study Details</h2>

<input id="subjects" placeholder="Subjects (Math, Physics, Programming)">

<input id="hours" type="number" placeholder="Study Hours Per Day">

<button onclick="generatePlan()">Generate Study Plan</button>

<button onclick="generateWeekly()">Generate Weekly Plan</button>

<button onclick="downloadPlan()">Download Study Plan</button>

</div>


<div class="dashboard">

<div class="card">

<h2>Daily Study Plan</h2>

<table id="studyTable">

<thead>
<tr>
<th>Subject</th>
<th>Allocated Hours</th>
<th>Status</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>


<div class="card">

<h2>Study Time Distribution</h2>

<canvas id="studyChart"></canvas>

</div>


<div class="card">

<h2>Productivity Score</h2>

<div id="scoreBox">0%</div>

</div>


<div class="card">

<h2>AI Study Advice</h2>

<div id="advice"></div>

</div>


<div class="card">

<h2>Weekly Study Plan</h2>

<div id="weeklyPlan"></div>

</div>


<div class="card">

<h2>Pomodoro Focus Timer</h2>

<div id="timer">25:00</div>

<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>

</div>

</div>


<script src="script.js"></script>

</body>

</html>
